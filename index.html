<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltos Key</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .kutu {
            background-color: #161616;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            width: 90%;
            max-width: 340px;
        }
        .key {
            background-color: #0e0e0e;
            border: 1px dashed #555;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 15px 0;
            border-radius: 8px;
            user-select: all;
        }
        button {
            background-color: #2b2b2b;
            color: #fff;
            border: 1px solid #555;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="kutu">
        <h2>Oyun Key</h2>
        <div class="key" id="keyMetni">EYMEN-2026</div>
        <button onclick="kopyala()">Key'i Kopyala</button>
    </div>

    <script>
        function kopyala() {
            const metin = document.getElementById("keyMetni").innerText;
            navigator.clipboard.writeText(metin);
            alert("Kopyalandı: " + metin);
        }
    </script>
</body>
</html>
